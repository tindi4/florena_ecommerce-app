<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propositions de photos — Chaussures (3)</title>
<style>
  body { margin: 0; padding: 32px; font-family: Montserrat, 'Segoe UI', system-ui, sans-serif; color: #1f2a26; background: #fff; }
  h1 { font-weight: 400; font-size: 26px; margin: 0 0 4px; }
  p.sub { color: #6b7672; font-size: 13px; margin: 0 0 28px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  figure { margin: 0; }
  figure a { display: block; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 6px; background: #f2f4f3; }
  img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: #6b7672; padding-top: 8px; }
  figcaption b { font-size: 15px; font-weight: 600; color: #1f2a26; }
  @media (max-width: 700px) { body { padding: 16px; } .row { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<h1>Chaussures — talons portés par une femme noire</h1>
<p class="sub">Photos Unsplash (licence gratuite, usage commercial autorisé), recadrées au format 4:5 des vignettes. Cliquez sur une photo pour ouvrir sa page d'origine.</p>
<div class="row">
  <figure><a href="https://unsplash.com/photos/r0YH_Dz_Zw4"><img src="https://images.unsplash.com/photo-1563112643-5b286536a949?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C13</b> Sandales à brides, gros plan noir et blanc</figcaption></figure>
  <figure><a href="https://unsplash.com/photos/NO88fQSmrqQ"><img src="https://images.unsplash.com/photo-1667498234761-f22193b39483?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C14</b> Escarpins rouges, assise, fond blanc</figcaption></figure>
  <figure><a href="https://unsplash.com/photos/SoJizjeIQ8o"><img src="https://images.unsplash.com/photo-1730140495891-c7dda2c8acdd?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C15</b> Sandales roses à brides, ensemble fleuri</figcaption></figure>
  <figure><a href="https://unsplash.com/photos/-us0yj39B4c"><img src="https://images.unsplash.com/photo-1730140496026-eadccd3ce57e?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C16</b> Même séance, jambes croisées</figcaption></figure>
</div>
<div class="row">
  <figure><a href="https://unsplash.com/photos/2xRlLFZfowo"><img src="https://images.unsplash.com/photo-1730139783886-5b94fb768fa9?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C17</b> Robe en dentelle, sandales fines</figcaption></figure>
  <figure><a href="https://unsplash.com/photos/D9BsNmLOw4Q"><img src="https://images.unsplash.com/photo-1672486520095-858e1f66721e?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C18</b> Talons dorés, tailleur gris, de nuit</figcaption></figure>
  <figure><a href="https://unsplash.com/photos/bSCS4v-Ile4"><img src="https://images.unsplash.com/photo-1566516873518-0e53f9790285?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C19</b> Talons clairs, jupe en cuir, fond vert</figcaption></figure>
  <figure><a href="https://unsplash.com/photos/iastgWgPzR4"><img src="https://images.unsplash.com/photo-1767396858457-96adc0eee842?w=640&q=75&fit=crop&ar=4:5" alt=""></a><figcaption><b>C20</b> Talons noirs, jean, en extérieur</figcaption></figure>
</div>
</body>
